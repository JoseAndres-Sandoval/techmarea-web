<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargadores | Tech Marea</title>
    <!-- Fuentes y CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="header">
        <div class="logo">
            <h1>TECH <span>MAREA</span></h1>
        </div>
        
        <!-- Botón Hamburguesa -->
        <div class="menu-hamburguesa" id="btn-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="navegacion" id="enlaces-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#tienda">Tienda</a></li>
                <li><a href="index.html#servicio">Servicio Técnico</a></li>
                <li><a href="#contacto">Contacto</a></li>
                
                <!-- Ícono del carrito -->
                <li>
                    <a href="#" id="btn-abrir-carrito" class="icono-carrito">
                        🛒 Carrito <span id="contador-carrito">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- VENTANA DEL CARRITO -->
    <div id="ventana-carrito" class="carrito-oculto">
        <div class="cabecera-carrito">
            <h3>Tu Compra</h3>
            <button id="btn-cerrar-carrito" class="btn-cerrar">X</button>
        </div>
        
        <div id="lista-carrito-items">
            <p class="carrito-vacio">El carrito está vacío.</p>
        </div>
        
        <div class="pie-carrito">
            <h4>Total: <span id="total-carrito">$0</span></h4>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-vaciar-carrito" style="width: 40%; padding: 10px; background: transparent; border: 1px solid #ff4c4c; color: #ff4c4c; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: inherit; transition: 0.3s;">
                    VACIAR
                </button>
                <button id="btn-pagar" style="width: 60%; padding: 10px; background: transparent; border: 1px solid #00d2ff; color: #00d2ff; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: inherit; transition: 0.3s;">
                    WHATSAPP 📱
                </button>
            </div>
            <button id="btn-mercadopago" style="width: 100%; margin-top: 10px; padding: 12px; background: #009ee3; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: inherit;">
                Pagar con Mercado Pago 💳
            </button>
        </div>
    </div>

    <!-- SECCIÓN CATÁLOGO DE PRODUCTOS -->
    <main class="seccion-catalogo">
        <h2 class="titulo-seccion">Catálogo de <span>Cargadores</span></h2>
        
        <div class="controles-catalogo">
            <input type="text" id="buscador-productos" placeholder="Buscar cargador... (ej: Raptor, 45W)" class="input-busqueda">
            
            <select id="filtro-categorias" class="select-categoria">
                <option value="todos">Todos los modelos</option>
                <option value="cargador-pared">Cargadores de Pared</option>
                <option value="cargador-auto">Cargadores de Auto</option>
                <option value="inalambrico">Cargadores Inalámbricos</option>
            </select>
        </div>
        
        <div id="contenedor-productos" class="grilla-articulos">
            <!-- Los productos se generarán con JS -->
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer" id="contacto">
        <div class="footer-copyright">
            <p>&copy; 2026 Tech Marea. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- MODAL PARA ZOOM Y GALERÍA DE IMÁGENES -->
    <div id="modalImagen" class="modal-zoom">
        <span class="cerrar-modal">&times;</span>
        <span class="flecha-modal izq" id="flechaIzq">&#10094;</span>
        <img class="modal-contenido" id="imgAmpliacion">
        <span class="flecha-modal der" id="flechaDer">&#10095;</span>
    </div>

    <!-- Scripts -->

    <script type="module" src="js/cargador.js"></script>
</body>
</html>
