<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarea | Cotizador de reparaciones</title>
    <link rel="icon" href="assets/img/logo-olas.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background:#0b0b0b; color:#fff; font-family:'Poppins',sans-serif; padding:30px 16px; }
        .cot-caja { max-width:860px; margin:0 auto; background:#161616; padding:24px; border-radius:12px; border:1px solid #333; }
        .cot-caja input, .cot-caja select { padding:12px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; font-family:inherit; font-size:1rem; box-sizing:border-box; }
        .cot-barra { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 8px; }
        .cot-barra #cot-buscar { flex:1 1 260px; }
        .cot-estado { color:#aaa; font-size:.85rem; min-height:1.2em; }
        .cot-links { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 18px; }
        .cot-links a { font-size:.85rem; color:var(--color-cian); border:1px solid #2a4a50; padding:6px 10px; border-radius:20px; text-decoration:none; }
        .cot-item { display:grid; grid-template-columns:1fr auto; gap:6px 14px; padding:14px; border:1px solid #2b2b2b; border-radius:10px; margin-bottom:10px; background:#1b1b1b; }
        .cot-item.agotado { opacity:.5; }
        .cot-modelo { font-weight:600; }
        .cot-det { color:#bbb; font-size:.85rem; }
        .cot-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
        .cot-tag { font-size:.72rem; padding:2px 8px; border-radius:10px; background:#2a2a2a; color:#ccc; }
        .cot-tag.ok { background:#123d22; color:#7dffa8; }
        .cot-tag.no { background:#4a1515; color:#ff9a9a; }
        .cot-tag.of { background:#4a3b10; color:#ffd36b; }
        .cot-precio { text-align:right; }
        .cot-final { font-family:'Exo 2',sans-serif; font-size:1.5rem; font-weight:800; color:var(--color-cian); }
        .cot-costo { color:#888; font-size:.75rem; }
        .cot-wa { grid-column:1 / -1; justify-self:start; background:#25d366; color:#06210f; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; font-family:inherit; }
        .cot-ajustes { margin-top:30px; border-top:1px solid #333; padding-top:20px; }
        .cot-ajustes .fila { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
        .cot-ajustes input { width:140px; text-align:right; }
        @media (max-width:520px){ .cot-item{ grid-template-columns:1fr; } .cot-precio{ text-align:left; } }
    </style>
</head>
<body>
<div class="cot-caja">

    <div id="seccion-login">
        <h2 style="color:var(--color-cian); text-align:center; margin-bottom:20px;">🔒 Cotizador TechMarea</h2>
        <form id="form-login" style="display:flex; flex-direction:column; gap:15px; max-width:380px; margin:0 auto;">
            <input type="email" id="input-email" placeholder="Correo" autocomplete="username" required>
            <input type="password" id="input-password" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit" class="btn-neon" style="padding:15px; border:none; cursor:pointer;">Ingresar</button>
        </form>
        <p id="mensaje-login" style="text-align:center; color:#ff6b6b; margin-top:15px; min-height:1em;"></p>
    </div>

    <div id="seccion-cotizador" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <h2 style="color:var(--color-cian); margin:0;">🛠️ Cotizar reparación</h2>
            <button id="btn-salir" style="background:none; border:1px solid #555; color:#aaa; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:inherit;">Salir</button>
        </div>

        <div class="cot-barra">
            <input type="search" id="cot-buscar" placeholder="Modelo del equipo (ej: A15, G9 Power, iPhone 11)" autocomplete="off">
            <select id="cot-tipo">
                <option value="">Todas las reparaciones</option>
                <option value="modulo">Módulo / pantalla</option>
                <option value="bateria">Batería</option>
                <option value="placa">Pin / placa de carga</option>
                <option value="flex">Flex</option>
                <option value="tapa">Tapa trasera</option>
                <option value="glass">Glass / OCA</option>
            </select>
        </div>
        <label style="font-size:.9rem; color:#ccc;"><input type="checkbox" id="cot-disponibles" style="padding:0; width:auto;"> Ocultar agotados</label>
        <div style="display:flex; justify-content:space-between; gap:10px; margin-top:8px;">
            <span class="cot-estado" id="cot-estado">Cargando listas de proveedores…</span>
            <button id="btn-recargar" style="background:none; border:none; color:var(--color-cian); cursor:pointer; font-family:inherit;">↻ Actualizar listas</button>
        </div>

        <div class="cot-links" id="cot-links"></div>
        <div id="cot-resultados"></div>

        <div class="cot-ajustes" id="cot-ajustes" style="display:none;">
            <h3 style="margin-bottom:6px;">⚙️ Precios del servicio (solo admin)</h3>
            <p style="color:#aaa; font-size:.85rem; margin-bottom:14px;">Precio al cliente = repuesto + ganancia % + mano de obra (redondeado hacia arriba a $500).</p>
            <div id="cot-campos"></div>
            <button id="btn-guardar-ajustes" class="btn-neon" style="padding:10px 16px; border:none; cursor:pointer; margin-top:8px;">Guardar</button>
            <span id="msg-ajustes" style="margin-left:10px; color:#7dffa8; font-size:.9rem;"></span>
        </div>
    </div>
</div>
<script type="module" src="js/cotizador.js"></script>
</body>
</html>
